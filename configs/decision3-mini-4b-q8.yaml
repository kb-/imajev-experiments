# Install: uv run python scripts/install_decision3.py
# Replaces the Nox opponent. GPU integration verified on RTX 3070 Laptop (8 GB).
# UNSUITED for unassisted strategy in the tested setup: 11/12 losses vs minimax.
# Evaluation: ../docs/evaluation/decision3-mini-q8.md
game:
  default: tic_tac_toe
recognition:
  backend: llama_cpp
  model: liquid-d1-3b-q8
  protocol: systemone
  input_mode: text_image
  endpoint: http://127.0.0.1:8080/v1/systemone
  executable: ../runtimes/llama_cpp/install/llama-server
  model_path: ../models/liquid-d1-3b/model.gguf
  projector_path: ../models/liquid-d1-3b/mmproj-d1-3B-Q8_0.gguf
  context_limit: 8192
  max_choices: 255
  min_choice_probability: 0.615
  runtime_args: ["-ngl", "99"]
recognition_fallback:
  backend: imajev
  model: imajev-4b-nf4
  min_effective_probability: 0.65
  after_rejections: 3
opponent:
  backend: llama_cpp
  model: decision3-mini-4b-q8
  protocol: systemone
  input_mode: text
  prompt_variant: quoted
  move_temperature: 0
  tactical_guard: false
  max_choices: 255
  executable: ../runtimes/decision3/install/llama-server
  model_path: ../models/decision3-mini-4b/vllm-d3-mini-Q8_0.gguf
  context_limit: 8192
  runtime_args: ["-ngl", "99", "-b", "8192", "-ub", "8192"]
diagnostics:
  directory: ../sessions
learning:
  coach_backend: ollama
  model: qwen3.6:latest
  ollama_url: http://127.0.0.1:11434
  directory: ../learning/coached-quoted
