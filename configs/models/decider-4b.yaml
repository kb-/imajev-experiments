# Example profile: install assets manually and edit local paths before use.
game:
  default: tic_tac_toe
recognition:
  backend: imajev
  model: imajev-4b-nf4
opponent:
  backend: decider
  model: decider-4b-q4
  protocol: systemone
  input_mode: text
  prompt_variant: quoted
  move_temperature: 0
  tactical_guard: true
  max_choices: 255
  executable: ../../runtimes/decider/.venv/bin/python
  model_path: ../../models/decider-4b/model.gguf
  context_limit: 8192
