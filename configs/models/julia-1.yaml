# Example profile: install assets manually and edit local paths before use.
game:
  default: tic_tac_toe
recognition:
  backend: imajev
  model: imajev-4b-nf4
opponent:
  backend: llama_cpp
  model: julia-1-q8
  protocol: systemone
  input_mode: text
  prompt_variant: quoted
  move_temperature: 0
  tactical_guard: true
  max_choices: 255
  executable: ../../runtimes/llama_cpp/install/llama-server
  model_path: ../../models/julia-1/model.gguf
  context_limit: 8192
  runtime_args: ["-ngl", "99"]
