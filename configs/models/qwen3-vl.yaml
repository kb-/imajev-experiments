# Text-state opponent profile verified with the installed Ollama model.
game:
  default: tic_tac_toe
recognition:
  backend: imajev
  model: imajev-4b-nf4
opponent:
  backend: ollama
  model: qwen3-vl:latest
  protocol: chat
  input_mode: text
  prompt_variant: quoted
  move_temperature: 0
  generation_temperature: 0
  generation_max_tokens: 512
  context_limit: 4096
  tactical_guard: true
