[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imajev-drawing-game"
version = "0.1.0"
description = "A local drawing game with an Imajev opponent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.7,<7", "PyYAML>=6,<7", "httpx>=0.27,<1"]

[project.scripts]
imajev-game = "app.main:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
